[tab MANUAL]
art file=skin/looks/_bg_print.svg
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALGRIT: SEVEN LO-FI EFFECTS IN ONE BOX" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:0
text cx=60 cy=280 label="Dust, crush, filter, kill, echo, chop and ring. Pick one from the pads, shape it with its own knobs, and blend" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=312 label="it with MIX." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=360 label="Add it as an insert effect on a track, program, pad or bus. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=392 label="Tap a pad to pick an effect. Each effect keeps its own settings, so you can flip between them and come back." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=424 label="Switching crossfades, so it does not click." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:0
text cx=84 cy=456 label="MIX blends the original (0 %) with the effect (100 %). OUTPUT runs from -24 to +12 dB." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:0
text cx=60 cy=240 label="THE SEVEN EFFECTS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=280 label="DUST: glue compression, soft saturation and a darker top, with hiss, crackle and rumble that follow the" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=312 label="music, and wobble. COMP, NOISE, WOBBLE." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=344 label="CRUSH: bit depth and sample-rate reduction like an early sampler. BITS (2 to 16), RATE (1.5 to 44.1 kHz)," size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=84 cy=376 label="TONE." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=408 label="FILTER: a resonant LOW, BAND or HIGH PASS filter into a saturator. CUTOFF, RESONANCE, DRIVE." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=440 label="KILL: a DJ-style three-band kill EQ: below 250 Hz, 250 Hz to 3 kHz, above 3 kHz. LOW, MID, HIGH." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=472 label="ECHO: a dark tape echo locked to your tempo, 1/16 to 1/2 with triplet and dotted times. FEEDBACK, LEVEL." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=504 label="CHOP: a tempo gate that follows the song position, 1/4 to 1/32 with triplets. DEPTH, PAN (left/right bounce)." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:1
text cx=84 cy=536 label="RING: ring modulation by a tone that an LFO can sweep two octaves each way. FREQ, SWEEP, SPEED." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:1
text cx=60 cy=240 label="PRESETS AND ROLL" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:2
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=280 label="MPC's PRESET menu: Dusty drum bus, Worn record, 12-bit grit, Broken, Next room, Telephone, Dub throw," size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=312 label="Stutter, Ping-pong chop and Metal, then the four chain presets." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=344 label="ROLL gives the effect that is on new settings. MILD, MEDIUM or WILD sets how far it goes, and WILD sometimes" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=84 cy=376 label="picks another effect too." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:2
text cx=84 cy=408 label="Chain presets: Dusty Loop, 90s Stab, Break Bus and Dub Drums. See the CHAINS page." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=456 label="Match levels with OUTPUT before you judge a setting." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:2
text cx=60 cy=240 label="FX CHAINS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:3
text cx=60 cy=280 label="Put the plugins on a track's inserts in the order shown, then pick the same preset name in each one." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=328 label="DUSTY LOOP (soul, jazz and library loops): Bleed > Patina > GRIT. Grit is a low-pass FILTER near 4 kHz." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=360 label="90s STAB (chopped horns, keys and vocal stabs): GRIT > Punch > Bleed > Patina. Grit is a 12-bit CRUSH." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=392 label="BREAK BUS (a boom-bap drum bus): Punch > GRIT > Bleed > Patina. Grit is DUST." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:3
text cx=84 cy=424 label="DUB DRUMS (lo-fi dub drums): Patina > Punch > Bleed > GRIT. Grit is a dotted-eighth ECHO." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=472 label="Here, in Patina and in Bleed the name is in the MPC's PRESET menu. In Punch it is on the PRESETS buttons." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=520 label="Rules of thumb: Punch early, Bleed before Patina, echo and chop last, one noise source per chain, and match" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=552 label="levels with OUTPUT before you decide." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:3
text cx=60 cy=240 label="USER PRESETS" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=280 label="To save: open the USER page, tap SAVE, then tap a slot. The slot now reads USER and its number." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=312 label="To load: tap a slot. The slot you loaded last is lit." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=344 label="Saving to a slot that is already filled replaces it straight away." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=376 label="The 8 slots are kept on the drive the plugin is on, in a folder called PotentialSuite Presets. Every project" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=408 label="and every copy of the plugin sees them, and updating the plugin keeps them." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=440 label="A slot keeps the effect that is on and the settings of all seven." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:4
text cx=84 cy=472 label="A chain of your own: save each plugin's part to the same slot number, for example USER 3 in Punch, Grit and" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=84 cy=504 label="Bleed. Later, tap USER 3 in each." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=1b1a18 when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=280 label="Q-Links: the effect, MIX and OUTPUT, then the knobs of the effects." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=312 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=344 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETTINGS page. A new look shows the next time" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=84 cy=376 label="the plugin loads." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=408 label="ECHO and CHOP follow the project tempo. CHOP lines up with the bar while the MPC plays." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=440 label="In ECHO the dry sound always passes through." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=1b1a18 when=manual_page:5
text cx=84 cy=472 label="Stereo in, stereo out, at 44.1 kHz." size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialgrit" size=1.45 weight=600 case=none align=left color=3d3a34 when=manual_page:5
